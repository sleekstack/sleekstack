linkWorkspacePackages: true
packages:
  - apps/*
  - packages/*
  - tooling/*

overrides:
  postcss: '>=8.5.23'
  nanoid: '>=3.3.18 <4'
  sharp: '>=0.35.4'
  baseline-browser-mapping: '>=2.11.0'
# sharp 0.35.5 (security override target) is newer than pnpm 11's default
# 1-day minimumReleaseAge; drop this once it ages past the cutoff.
minimumReleaseAgeExclude:
  - sharp
  - '@img/*'
