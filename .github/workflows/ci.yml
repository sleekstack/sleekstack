name: CI

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck


      - name: Require test/typecheck scripts
        run: |
          for pkg in core react next; do
            node -e "const s=require('./packages/$pkg/package.json').scripts||{};for(const k of ['test','typecheck'])if(!s[k]){console.error('packages/$pkg missing script: '+k);process.exit(1)}"
          done

      - name: Test
        run: pnpm test
