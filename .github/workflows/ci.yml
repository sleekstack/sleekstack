name: CI

on:
  push:
    branches:
      - master

  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Require test/typecheck scripts
        run: |
          for pkg in packages/core packages/react packages/islands packages/next packages/kit apps/showcase apps/showcase-kit apps/docs; do
            node -e "const s=require('./$pkg/package.json').scripts||{};for(const k of ['test','typecheck'])if(!s[k]){console.error('$pkg missing script: '+k);process.exit(1)}"
          done

      - name: Test
        run: pnpm test

      - name: Kit declaration emit
        run: pnpm --filter @sleekstack/kit build:types

      - name: Build showcase
        run: pnpm --filter showcase build

      - name: Showcase bundle split
        run: pnpm --filter showcase test:bundle

      - name: Build showcase-kit
        run: pnpm --filter showcase-kit build

      - name: Showcase-kit bundle split
        run: pnpm --filter showcase-kit test:bundle

      - name: Build docs
        run: pnpm --filter docs build

      - name: Test docs
        run: pnpm --filter docs test

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter showcase exec playwright install --with-deps chromium

      - name: Build showcase
        run: pnpm --filter showcase build

      - name: Showcase e2e smoke
        run: pnpm --filter showcase test:e2e

      - name: Build showcase-kit
        run: pnpm --filter showcase-kit build

      - name: Showcase-kit e2e smoke
        run: pnpm --filter showcase-kit test:e2e
